<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disporapar Kalimantan Barat</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--gold:#F9C23C;--navy:#141840;--teal:#0A8FBF;--cyan:#00A3E0;--pink:#DF2573;--green:#12B04F;--bg:#fff;--surf:#FBF6E6;--card:#fff;--tx:#141840;--mut:#5d6075;--ln:#e1dccb;--ft:#F7DE8E;--ftx:#141840;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1c;--surf:#1b2629;--card:#223034;--tx:#eef3f3;--mut:#a9b8bb;--ln:#37484c;--ft:#3a3015;--ftx:#f3e7bd;--teal:#4cc3cd}}
:root[data-theme="dark"]{--bg:#121a1c;--surf:#1b2629;--card:#223034;--tx:#eef3f3;--mut:#a9b8bb;--ln:#37484c;--ft:#3a3015;--ftx:#f3e7bd;--teal:#4cc3cd}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Montserrat,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0 0 .5em;line-height:1.2}
a{color:inherit;text-decoration:none}img,svg{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--gold);z-index:11}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:8px 5vw;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;line-height:1.2}
nav{display:flex;gap:18px;font-weight:600;font-size:14px}nav a{padding:6px 2px;border-bottom:2px solid transparent}nav a.on,nav a:hover{border-color:#2b2410}
#mb{display:none;background:none;border:2px solid #2b2410;border-radius:8px;padding:6px 10px;font-size:18px;color:#2b2410}
@media(max-width:700px){#mb{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--gold);flex-direction:column;padding:8px 5vw 14px;gap:4px}nav.open{display:flex}}
.wrap{max-width:1100px;margin:auto;padding:0 5vw}
.hero{min-height:300px;display:flex;align-items:center;color:#fff;background:linear-gradient(120deg,rgba(8,60,70,.85),rgba(14,124,134,.55)),linear-gradient(160deg,#1c8aa0,#2e6b3a 60%,#d9a441)}
.hero .in{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;padding:36px 5vw;max-width:1100px;margin:auto;width:100%}
.hero h1{font-size:clamp(26px,5vw,44px)}.hero.sm{min-height:200px;text-align:center}.hero.sm .in{display:block}
.pic{aspect-ratio:16/10;border-radius:10px;background:linear-gradient(135deg,#DF2573,#FDB515,#00A3E0);box-shadow:0 6px 18px #0004}
@media(max-width:700px){.hero .in{grid-template-columns:1fr}}
.btn{display:inline-block;border:0;border-radius:999px;padding:9px 26px;background:var(--gold);color:#2b2410;font:600 14px Montserrat;cursor:pointer;border:1px solid #b8921f}
.btn.c{background:var(--cyan);color:#fff;border-color:var(--cyan)}
.bar{display:flex;gap:10px;margin:28px auto 8px;max-width:640px}.bar input,.bar select{padding:10px 16px;border-radius:999px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}.bar input{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin:20px 0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden;box-shadow:0 4px 10px #0002;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px)}
.card .im{aspect-ratio:4/3}.card div+div,.card .tx{padding:10px 12px}.card b{font-family:'Playfair Display',serif;display:block}.card small{color:var(--mut)}
.sec{padding:36px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.split.r .pic{order:2}
@media(max-width:700px){.split{grid-template-columns:1fr}.split.r .pic{order:0}}
.tile{aspect-ratio:3/2;border-radius:10px;position:relative;overflow:hidden;color:#fff;font:700 18px 'Playfair Display',serif;display:flex;align-items:flex-end;padding:10px;text-shadow:0 1px 4px #000}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tiles.b{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.box{background:var(--surf);border:1px solid var(--ln);border-radius:10px;padding:18px}
form.f{display:grid;gap:10px}label{font-size:12px;color:var(--mut)}
input,textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.auth{max-width:420px;margin:40px auto}.tog{display:flex;border-radius:999px;overflow:hidden;border:1px solid #b8921f;margin-bottom:16px}.tog button{flex:1;border:0;padding:8px;background:var(--surf);color:var(--tx);font:600 14px Montserrat;cursor:pointer}.tog .on{background:var(--gold);color:#2b2410}
.cont{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center}@media(max-width:600px){.cont{grid-template-columns:1fr}}
.cont .box{background:#fffa;color:#1d2a2e}
.map{aspect-ratio:16/7;min-height:140px;border-radius:10px;background:linear-gradient(135deg,#bfe9d3,#9fd4e8);display:grid;place-items:center;font-size:34px}
.dh{height:200px;position:relative;display:flex;align-items:flex-end;color:#fff;padding:0 5vw 16px}.dh h1{margin:0;text-shadow:0 2px 6px #000}
.tabs{display:flex;gap:26px;justify-content:center;border-bottom:1px solid var(--ln);padding:10px;font-weight:600}.tabs a{cursor:pointer}
.d2{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin:20px 0}@media(max-width:800px){.d2{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--ln);padding:5px 0;font-size:13px}
.pg{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}.pg span{width:28px;height:28px;border:1px solid var(--tx);border-radius:50%;display:grid;place-items:center;font-size:12px}
.brand img{height:42px;width:auto;display:block}input[type=color]{width:60px;height:36px;padding:2px;display:inline-block}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--ln)}.btn.s{padding:5px 14px;font-size:12px}.btn.x{background:var(--pink);color:#fff;border-color:var(--pink)}
.fl{display:inline-block;background:#fff;border-radius:10px;padding:6px 10px}
.dh{align-items:center;height:220px;box-shadow:inset 0 -90px 70px -40px #0009}.av{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #fff;margin-right:14px}
#mp{display:block;height:320px;aspect-ratio:auto;position:relative;z-index:0}.pin{font-size:28px;line-height:30px}
.leaflet-container{overflow:hidden;position:relative;background:#cfe8f0;outline:0}.leaflet-container img{max-width:none!important}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}.leaflet-tile-pane{z-index:200}.leaflet-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;margin:10px;clear:both}.leaflet-left .leaflet-control{float:left}.leaflet-right .leaflet-control{float:right}
.leaflet-bar{box-shadow:0 1px 5px #0006;border-radius:4px;overflow:hidden}.leaflet-bar a{display:block;width:30px;height:30px;line-height:30px;text-align:center;background:#fff;color:#000;border-bottom:1px solid #ccc;font:700 18px sans-serif;cursor:pointer}
.leaflet-control-attribution{background:#fffc;font-size:10px;padding:0 4px;color:#333;margin:0}.leaflet-div-icon{background:none;border:0}
.so{display:flex;gap:14px;justify-content:center;margin-top:12px}.so img{width:32px;height:32px}.io{width:32px;height:32px}.id{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .il{display:none}:root:not([data-theme="light"]) .id{display:inline}}
:root[data-theme="dark"] .il{display:none}:root[data-theme="dark"] .id{display:inline}
.ctl{display:flex;gap:8px;align-items:center}nav{margin-left:auto}.ctl button,.ctl select{border:2px solid var(--navy);background:transparent;color:var(--navy);border-radius:8px;padding:5px 8px;font:600 13px Montserrat,sans-serif;cursor:pointer;min-height:34px}.ctl select option{color:#141840;background:#fff}
@media(max-width:700px){nav{margin-left:0}.ctl{margin-left:auto}#mb{order:3}}@media(max-width:480px){.brand img{height:30px}}.brand{min-width:0}
footer{background:var(--ft);color:var(--ftx);padding:28px 5vw;margin-top:30px}
.fg{max-width:1100px;margin:auto;display:grid;grid-template-columns:1.3fr 1.3fr 1fr 1fr;gap:20px;font-size:12px}@media(max-width:800px){.fg{grid-template-columns:1fr 1fr}}@media(max-width:480px){.fg{grid-template-columns:1fr}}
.fg b{display:block;margin-bottom:4px}.fg a{display:block}

["danau-sentarum","Danau Sentarum","Kapuas Hulu","Paket Wisata",["#1f7a8c","#3d8b4f"],"Taman Nasional Danau Sentarum merupakan kawasan konservasi yang memiliki ekosistem danau musiman, hutan rawa air tawar, dan hutan hujan tropis. Kawasan ini menjadi habitat bagi beragam satwa dan budaya masyarakat di sekitar kawasan.","08:00 - 17:00",["Resort Sepandan","Hotel Grand Banana Putussibau","Penginapan Alif Jaya"]],
["pulau-randayan","Pulau Randayan","Bengkayang","Paket Wisata",["#19b5e6","#f3e2a9"],"Pulau Randayan merupakan destinasi wisata bahari dengan pantai berpasir putih, air laut yang jernih, serta panorama bawah laut. Cocok untuk snorkeling, berenang, dan fotografi.","08:00 - 17:00",["Randayan Island Resort","Pulau Lemukutan","Pulau Kabung"]],
["air-terjun-bedawat","Air Terjun Bedawat","Landak","Paket Wisata",["#2e6b3a","#8fc5a0"],"Air Terjun Bedawat merupakan destinasi wisata alam yang memiliki aliran air bertingkat dan berada di lingkungan hutan tropis. Aktivitas yang dapat dilakukan antara lain menikmati pemandangan dan berfoto.","24/7",["Air Terjun Bunangar","Rumah Betang Sahaan"]],
["bukit-kelam","Bukit Kelam","Sintang","Paket Wisata",["#3a5a40","#9ab87a"],"Bukit Kelam merupakan objek wisata alam ungulan Kabupaten Sintang berupa monolit batuan besar. Kawasan ini menawarkan panorama alam, hutan, dan flora fauna yang khas.","07:00 - 17:00",["New Setia Hotel","Urbanview Hotel Bagoes","My Home Sintang"]],
["bukit-batu-daya","Bukit Batu Daya","Sintang","Paket Wisata",["#34668f","#8fb08c"],"Bukit Batu Daya merupakan destinasi wisata alam dengan formasi batuan raksasa dan bentuk bukit yang khas, cocok untuk pendakian dan fotografi.","24/7",["Taman Nasional Gunung Palung","Pantai Tanjung Batu"]],
["pantai-tanjung-api","Pantai Tanjung Api","Ketapang","Paket Wisata",["#2b8a6e","#e6c27a"],"Pantai Tanjung Api berada di kawasan pesisir Pulau dan dikenal sebagai wisata bahari. Daya tariknya meliputi panorama pantai, pasir, laut, serta lingkungan pesisir yang memiliki keindahan.","24/7",["Pantai Temajuk","Pantai Camar Bulan","Tanjung Datuk"]]];
