<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--gold:#F9C23C;--navy:#141840;--teal:#0A8FBF;--cyan:#00A3E0;--pink:#DF2573;--green:#12B04F;--bg:#fff;--surf:#FBF6E6;--card:#fff;--tx:#141840;--mut:#5d6075;--ln:#e1dccb;--ft:#F7DE8E;--ftx:#141840;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1c;--surf:#1b2629;--card:#223034;--tx:#eef3f3;--mut:#a9b8bb;--ln:#37484c;--ft:#3a3015;--ftx:#f3e7bd;--teal:#4cc3cd}}
:root[data-theme="dark"]{--bg:#121a1c;--surf:#1b2629;--card:#223034;--tx:#eef3f3;--mut:#a9b8bb;--ln:#37484c;--ft:#3a3015;--ftx:#f3e7bd;--teal:#4cc3cd}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Montserrat,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0 0 .5em;line-height:1.2}
a{color:inherit;text-decoration:none}img,svg{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--gold);z-index:11}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:8px 5vw;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;line-height:1.2}
nav{display:flex;gap:18px;font-weight:600;font-size:14px}nav a{padding:6px 2px;border-bottom:2px solid transparent}nav a.on,nav a:hover{border-color:#2b2410}
#mb{display:none;background:none;border:2px solid #2b2410;border-radius:8px;padding:6px 10px;font-size:18px;color:#2b2410}
@media(max-width:700px){#mb{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--gold);flex-direction:column;padding:8px 5vw 14px;gap:4px}nav.open{display:flex}}
.wrap{max-width:1100px;margin:auto;padding:0 5vw}
.hero{min-height:300px;display:flex;align-items:center;color:#fff;background:linear-gradient(120deg,rgba(8,60,70,.85),rgba(14,124,134,.55)),linear-gradient(160deg,#1c8aa0,#2e6b3a 60%,#d9a441)}
.hero .in{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;padding:36px 5vw;max-width:1100px;margin:auto;width:100%}
.hero h1{font-size:clamp(26px,5vw,44px)}.hero.sm{min-height:200px;text-align:center}.hero.sm .in{display:block}
.pic{aspect-ratio:16/10;border-radius:10px;background:linear-gradient(135deg,#DF2573,#FDB515,#00A3E0);box-shadow:0 6px 18px #0004}
@media(max-width:700px){.hero .in{grid-template-columns:1fr}}
.btn{display:inline-block;border:0;border-radius:999px;padding:9px 26px;background:var(--gold);color:#2b2410;font:600 14px Montserrat;cursor:pointer;border:1px solid #b8921f}
.btn.c{background:var(--cyan);color:#fff;border-color:var(--cyan)}
.bar{display:flex;gap:10px;margin:28px auto 8px;max-width:640px}.bar input,.bar select{padding:10px 16px;border-radius:999px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}.bar input{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin:20px 0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden;box-shadow:0 4px 10px #0002;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px)}
.card .im{aspect-ratio:4/3}.card div+div,.card .tx{padding:10px 12px}.card b{font-family:'Playfair Display',serif;display:block}.card small{color:var(--mut)}
.sec{padding:36px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.split.r .pic{order:2}
@media(max-width:700px){.split{grid-template-columns:1fr}.split.r .pic{order:0}}
.tile{aspect-ratio:3/2;border-radius:10px;position:relative;overflow:hidden;color:#fff;font:700 18px 'Playfair Display',serif;display:flex;align-items:flex-end;padding:10px;text-shadow:0 1px 4px #000}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tiles.b{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.box{background:var(--surf);border:1px solid var(--ln);border-radius:10px;padding:18px}
form.f{display:grid;gap:10px}label{font-size:12px;color:var(--mut)}
input,textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.auth{max-width:420px;margin:40px auto}.tog{display:flex;border-radius:999px;overflow:hidden;border:1px solid #b8921f;margin-bottom:16px}.tog button{flex:1;border:0;padding:8px;background:var(--surf);color:var(--tx);font:600 14px Montserrat;cursor:pointer}.tog .on{background:var(--gold);color:#2b2410}
.cont{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center}@media(max-width:600px){.cont{grid-template-columns:1fr}}
.cont .box{background:#fffa;color:#1d2a2e}
.map{aspect-ratio:16/7;min-height:140px;border-radius:10px;background:linear-gradient(135deg,#bfe9d3,#9fd4e8);display:grid;place-items:center;font-size:34px}
.dh{height:200px;position:relative;display:flex;align-items:flex-end;color:#fff;padding:0 5vw 16px}.dh h1{margin:0;text-shadow:0 2px 6px #000}
.tabs{display:flex;gap:26px;justify-content:center;border-bottom:1px solid var(--ln);padding:10px;font-weight:600}.tabs a{cursor:pointer}
.d2{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin:20px 0}@media(max-width:800px){.d2{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--ln);padding:5px 0;font-size:13px}
.pg{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}.pg span{width:28px;height:28px;border:1px solid var(--tx);border-radius:50%;display:grid;place-items:center;font-size:12px}
.brand img{height:42px;width:auto;display:block}input[type=color]{width:60px;height:36px;padding:2px;display:inline-block}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--ln)}.btn.s{padding:5px 14px;font-size:12px}.btn.x{background:var(--pink);color:#fff;border-color:var(--pink)}
.fl{display:inline-block;background:#fff;border-radius:10px;padding:6px 10px}
.dh{align-items:center;height:220px;box-shadow:inset 0 -90px 70px -40px #0009}.av{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #fff;margin-right:14px}
#mp,#cm{display:block;height:320px;aspect-ratio:auto;position:relative;z-index:0}.pin{font-size:28px;line-height:30px}
.leaflet-container{overflow:hidden;position:relative;background:#cfe8f0;outline:0}.leaflet-container img{max-width:none!important}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}.leaflet-tile-pane{z-index:200}.leaflet-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;margin:10px;clear:both}.leaflet-left .leaflet-control{float:left}.leaflet-right .leaflet-control{float:right}
.leaflet-bar{box-shadow:0 1px 5px #0006;border-radius:4px;overflow:hidden}.leaflet-bar a{display:block;width:30px;height:30px;line-height:30px;text-align:center;background:#fff;color:#000;border-bottom:1px solid #ccc;font:700 18px sans-serif;cursor:pointer}
.leaflet-control-attribution{background:#fffc;font-size:10px;padding:0 4px;color:#333;margin:0}.leaflet-div-icon{background:none;border:0}
.so{display:flex;gap:14px;justify-content:center;margin-top:12px}.so img{width:32px;height:32px}.io{width:32px;height:32px}.id{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .il{display:none}:root:not([data-theme="light"]) .id{display:inline}}
:root[data-theme="dark"] .il{display:none}:root[data-theme="dark"] .id{display:inline}
.ctl{display:flex;gap:8px;align-items:center}nav{margin-left:auto}.ctl button,.ctl select{border:2px solid var(--navy);background:transparent;color:var(--navy);border-radius:8px;padding:5px 8px;font:600 13px Montserrat,sans-serif;cursor:pointer;min-height:34px}.ctl select option{color:#141840;background:#fff}
@media(max-width:700px){nav{margin-left:0}.ctl{margin-left:auto}#mb{order:3}}@media(max-width:480px){.brand img{height:30px}}.brand{min-width:0}
.tiles.c{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.tiles.c .tile{width:min(100%,320px)}
.tile[data-n]{cursor:pointer}.tile.sel{outline:4px solid var(--navy);outline-offset:3px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--gold);color:var(--navy);border-radius:999px;padding:4px 12px;font-weight:600}.chip button{border:0;background:none;cursor:pointer;color:inherit;font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px 10px}.pg span{cursor:pointer;user-select:none}.pg span.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}.pg span.dd{border:0;cursor:default}
#up{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:var(--navy);font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px #0005;opacity:0;pointer-events:none;transition:.25s;z-index:20}#up.show{opacity:1;pointer-events:auto}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}main{flex:1 0 auto}footer{flex-shrink:0}
.back{display:inline-block;background:var(--gold);color:var(--navy);padding:8px 18px;border-radius:10px;font-weight:600;box-shadow:0 2px 6px #0003}
.fbr{display:inline-flex;flex-direction:column;align-items:center}.fbr .so{margin-top:10px}
.pic.car{position:relative;overflow:hidden;background:#000}.ct{display:flex;height:100%;transition:transform .6s ease}.ct img{flex:0 0 100%;width:100%;height:100%;object-fit:cover}
.cb{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:#0008;color:#fff;font-size:24px;line-height:1;cursor:pointer}.cb.pv{left:8px}.cb.nx{right:8px}
.dt{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:8px}.dt button{width:10px;height:10px;border-radius:50%;border:0;background:#fffa;padding:0;cursor:pointer;transition:.3s}.dt button.on{background:var(--gold);width:24px;border-radius:6px}
@media(prefers-reduced-motion:reduce){.ct{transition:none}}
.pic.car.empty{background:linear-gradient(135deg,#DF2573,#FDB515,#00A3E0)}.car.empty .cb,.car.empty .dt{display:none}code{font-size:12px;background:var(--surf);padding:1px 5px;border-radius:4px;word-break:break-all}
button.card{text-align:left;font:inherit;color:inherit;padding:0;width:100%}
.bar{flex-wrap:wrap;max-width:760px}.bar input{min-width:160px}.bar select{max-width:100%}
.grid.ag{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.ac{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;border:1px solid var(--ln);box-shadow:0 4px 10px #0002;background:var(--surf) center/cover}
.ac .nm{position:absolute;left:0;right:0;bottom:0;padding:34px 10px 8px;color:#fff;font:700 15px 'Playfair Display',Georgia,serif;background:linear-gradient(transparent,#000b);text-shadow:0 1px 3px #000;transition:transform .2s}
.ac .nm small{display:block;font:500 11px Montserrat,sans-serif;opacity:.9}
.ac .ed{position:absolute;left:0;right:0;bottom:0;height:40px;display:grid;place-items:center;background:var(--gold);color:var(--navy);font:700 14px Montserrat,sans-serif;opacity:0;transform:translateY(100%);transition:.2s}
.ac .dl{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:0;background:#d92d20;color:#fff;font-size:12px;font-weight:700;line-height:1;cursor:pointer;opacity:0;transition:.2s;padding:0}
.ac:hover .ed,.ac:focus-within .ed{opacity:1;transform:none}.ac:hover .dl,.ac:focus-within .dl{opacity:1}.ac:hover .nm,.ac:focus-within .nm{transform:translateY(-40px)}
@media(hover:none){.ac .ed{opacity:1;transform:none}.ac .dl{opacity:1}.ac .nm{transform:translateY(-40px)}}
.mo{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:100;padding:20px}.mx{background:var(--card);color:var(--tx);border-radius:14px;padding:22px;max-width:400px;width:100%;box-shadow:0 10px 30px #0008}.mx h3{margin-top:0}.mb{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.mx .btn.x{background:#d92d20;border-color:#d92d20;color:#fff}
a.tile[data-s]{box-shadow:0 4px 10px #0003;transition:transform .2s ease,box-shadow .2s ease}
a.tile[data-s]:hover,a.tile[data-s]:focus-visible{transform:translateY(-5px);box-shadow:0 12px 20px #0004}a.tile[data-s]:active{transform:translateY(-2px)}
header{padding:12px 5vw;gap:16px}.ctl{gap:10px;margin-left:12px}.ctl button,.ctl select{padding:6px 12px;min-height:38px}
@media(min-width:701px){nav{gap:26px}}@media(max-width:700px){.ctl{margin-left:auto}}
header{padding-top:14px;padding-bottom:14px;padding-left:clamp(16px,3vw,48px);padding-right:clamp(16px,3vw,48px)}.brand img{height:46px}@media(max-width:480px){.brand img{height:34px}}
#ld{position:fixed;inset:0;z-index:300;background:var(--bg);color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:1;visibility:visible;transition:opacity .5s ease,visibility .5s}
#ld.off{opacity:0;visibility:hidden;pointer-events:none}#ld.fast{transition-duration:.15s}#ld img{height:52px;width:auto;max-width:78vw;display:block}
#ld .bar{width:150px;height:4px;border-radius:4px;background:var(--ln);overflow:hidden}#ld .bar i{display:block;width:40%;height:100%;background:var(--gold);border-radius:4px;animation:ldm 1.1s ease-in-out infinite}
@keyframes ldm{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
a.tile[data-s]{transition:transform .4s cubic-bezier(.22,.61,.36,1),box-shadow .4s cubic-bezier(.22,.61,.36,1);will-change:transform}a.tile[data-s]:hover,a.tile[data-s]:focus-visible{transform:translateY(-6px)}
.btn{cursor:pointer;transition:transform .28s cubic-bezier(.22,.61,.36,1),box-shadow .28s ease,filter .28s ease}.btn:hover{transform:translateY(-3px);box-shadow:0 8px 16px #0003;filter:brightness(1.07)}.btn:active{transform:none;box-shadow:none}.btn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
@media(prefers-reduced-motion:reduce){#ld .bar i{animation-duration:2.2s}}
#ld{transition:opacity .3s ease,visibility 0s linear 0s}#ld.off{transition:opacity .85s cubic-bezier(.4,0,.2,1),visibility 0s linear .85s}#ld.off.fast{transition:opacity .35s ease,visibility 0s linear .35s}
#up{display:grid;place-items:center;padding:0;line-height:0}#up svg{width:20px;height:20px;display:block}
:root{--tsh:0 4px 10px #0003;--tshh:0 12px 22px #0004;--bsh:0 8px 16px #0003}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--tsh:0 4px 14px #000a,0 0 0 1px #ffffff26;--tshh:0 14px 28px #000,0 0 0 2px #F9C23C;--bsh:0 0 0 3px #F9C23C88,0 8px 16px #000a}}
:root[data-theme="dark"]{--tsh:0 4px 14px #000a,0 0 0 1px #ffffff26;--tshh:0 14px 28px #000,0 0 0 2px #F9C23C;--bsh:0 0 0 3px #F9C23C88,0 8px 16px #000a}
a.tile[data-s]{box-shadow:var(--tsh)}a.tile[data-s]:hover,a.tile[data-s]:focus-visible{box-shadow:var(--tshh)}.btn:hover{box-shadow:var(--bsh)}
.pic.por{aspect-ratio:2/3;width:min(100%,360px);justify-self:center}.cb.pp{top:auto;bottom:8px;left:8px;transform:none;width:30px;height:30px;font-size:11px}
.ic{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.22em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex:none}

let D=[
["danau-sentarum","Danau Sentarum","Kapuas Hulu","Paket Wisata",["#1f7a8c","#3d8b4f"],"Taman Nasional Danau Sentarum merupakan kawasan konservasi yang memiliki ekosistem danau musiman, hutan rawa air tawar, dan hutan hujan tropis. Kawasan ini menjadi habitat bagi beragam satwa dan budaya masyarakat di sekitar kawasan.","08:00 - 17:00",["Resort Sepandan","Hotel Grand Banana Putussibau","Penginapan Alif Jaya"]],

<div class="wrap sec split"><form class="f" onsubmit="return sm(event)" novalidate><div><label for="cn">Nama</label><input id="cn" required autocomplete="name"></div><div><label for="ce">Email</label><input id="ce" type="email" required autocomplete="email"></div><div><label for="cs">Subjek</label><input id="cs"></div><div><label for="cm">Isi</label><textarea id="cm" rows="5" required></textarea></div><p id="cst" role="status"></p><button class="btn c">Kirim</button></form><div class="map" id="cm"></div></div>`,
login:()=>`<div class="wrap"><div class="box auth"><h2 style="text-align:center">Login</h2><div class="tog"><button class="${R=="Admin"?"":"on"}" type="button">Pengguna</button><button class="${R=="Admin"?"on":""}" type="button">Admin</button></div><form class="f" onsubmit="return lg(event)" novalidate><div><label id="ll">Email</label><input id="lu" required autocomplete="username"></div><div><label>Password</label><input id="lp" type="password" required autocomplete="current-password"></div><p class="err" id="fe" role="alert"></p><button class="btn"><i class="ic i-login"></i> Login</button></form><p id="lh" style="text-align:center;font-size:12px;color:var(--mut)">Demo admin: admin / admin123</p><p style="text-align:center;font-size:13px">Belum punya akun? Silahkan mendaftar <a href="#daftar" style="color:var(--teal)">di sini</a></p></div></div>`,
daftar:()=>`<div class="wrap"><div class="box auth"><h2 style="text-align:center">Pendaftaran</h2><form class="f" onsubmit="return reg(event)" novalidate><div><label>Nama</label><input id="rn" required autocomplete="name"></div><div><label>Email</label><input id="re" type="email" required autocomplete="email"></div><div><label>Password</label><input id="rp" type="password" required autocomplete="new-password"></div><div><label>Ulangi Password</label><input id="rq" type="password" required autocomplete="new-password"></div><p class="err" id="fe" role="alert"></p><button class="btn">Daftar</button></form><p style="text-align:center;font-size:13px">Sudah punya akun? <a href="#login" style="color:var(--teal)">Login</a></p></div></div>`,
admin:()=>!A?`<div class="wrap sec"><div class="box auth"><h2>Khusus Admin</h2><p>Silakan login sebagai Admin.</p><a class="btn" href="#login">Login</a></div></div>`:`<div class="wrap sec"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h2>Kelola Destinasi</h2><span><a class="btn c" href="#admin-tambah">+ Tambah Destinasi</a> <button class="btn" onclick="lo()"><i class="ic i-logout"></i> Keluar</button></span></div>
<div class="bar"><input id="aq" placeholder="Telusuri" aria-label="Cari"><select id="ac"><option value="">Semua kategori</option>${CT.map(x=>`<option value="${x}">${x}</option>`).join("")}</select><select id="ar"><option value="">Semua wilayah</option>${["Pontianak","Singkawang",...K].map(x=>`<option value="${x}">${x}</option>`).join("")}</select></div>
<div class="grid ag" id="ag"></div>
<div class="box" style="margin-top:24px"><b>Foto carousel Beranda</b><p style="margin:6px 0;font-size:13px">Nama file bebas. Semua foto di folder images/hero/ tampil otomatis di carousel (maks. 12).</p><a class="btn s c" target="_blank" rel="noopener" href="https://github.com/${REPO}/upload/${BR}/images/hero">Buka halaman unggah carousel</a></div></div>`,
jelajahi:()=>`<div class="wrap"><div class="bar"><input id="q" placeholder="Telusuri" aria-label="Cari"><select id="fl">${FO}</select>${ST.r&&KC[ST.r]?`<select id="kc" aria-label="Kecamatan"><option value="">Semua kecamatan</option>${KC[ST.r].map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select>`:""}</div><div id="res"></div><div class="pg" id="pg"></div></div>`

function det(id){const d=D.find(x=>x[0]==id);if(!d)return V.beranda();
return `<div class="dh" style="background:${d[9]?`url(${d[9]}) center/cover`:g(d[4])}">${d[8]?`<img class="av" src="${d[8]}" alt="">`:""}<h1>${d[1]}</h1><div class="dact"><button class="bk" id="bk" type="button" onclick="bkt('${d[0]}')" data-s="${bmk(d[0])?"on":"off"}" aria-pressed="${bmk(d[0])}" aria-label="${bmk(d[0])?"Hapus bookmark":"Simpan ke bookmark"}"><i class="ic ${bmk(d[0])?"i-bmfill":"i-bmadd"}"></i></button><button class="btn s c" type="button" onclick="atp('${d[0]}')">+ Rencana</button></div></div><div class="tabs"><a onclick="sc('o')">Tinjauan Luas</a><a onclick="sc('ga')">Galeri</a><a onclick="sc('pt')">Peta</a></div><div class="wrap" id="o"><div class="d2"><div class="box"><h3>Deskripsi</h3><p>${d[5]}</p></div><div><div class="box"><h3 style="text-align:center">Kontak</h3>${kt(d)}</div>${pxb(d)}<div class="box" style="margin-top:14px"><h3 style="text-align:center">Jadwal</h3>${d[6]=="24/7"?"<p style='text-align:center'><b>Kami selalu buka, 24/7</b></p>":days.map(x=>`<div class="row"><span>${x}</span><span>${d[6]}</span></div>`).join("")}</div></div></div>
<div class="box" id="ga"><h3>Galeri</h3><div class="tiles b" id="gl">${(d[10]&&d[10].length?d[10].map(u=>`<div class="tile" style="background:url(${u}) center/cover"></div>`):[`<p class="empty">Belum ada galeri untuk destinasi ini.</p>`]).join("")}</div></div>
<div class="box" id="pt" style="margin-top:18px"><h3>Peta</h3><div class="map" id="mp"></div>${d[11]!=null?`<p><a href="https://www.openstreetmap.org/?mlat=${d[11]}&mlon=${d[12]}#map=14/${d[11]}/${d[12]}" target="_blank" rel="noopener" style="color:var(--teal)">Buka di OpenStreetMap ↗</a> · <a href="https://www.google.com/maps/search/?api=1&query=${d[11]},${d[12]}" target="_blank" rel="noopener" style="color:var(--teal)">Buka di Google Maps ↗</a></p>`:""}</div>
<div class="box" style="margin-top:18px"><h3>Atraksi Sekitar</h3><p style="font-size:12px;color:var(--mut);margin:0">Data dari OpenStreetMap, radius hingga 30 km. Klik kartu untuk melihat lokasinya di peta di atas.</p><div class="grid" id="nb"></div></div></div>`}
